[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bertrobo"
version = "0.1.0"
description = "Raspberry Pi robot starter with ESP32 motor safety boundary"
requires-python = ">=3.11"
dependencies = ["openai>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bertrobo = "bertrobo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
